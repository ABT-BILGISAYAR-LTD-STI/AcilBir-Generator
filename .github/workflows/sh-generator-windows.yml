name: Custom Windows Client Generator
run-name: Custom Windows Client Generator
on: 
  workflow_dispatch:
    inputs:
      version:
        description: 'version to buld'
        required: true
        default: ''
        type: string
      zip_url:
        description: 'url to zip of json'
        required: true
        default: ''
        type: string
      app_version:
        description: 'custom app version string (overrides build version)'
        required: false
        default: ''
        type: string


env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
  SCITER_RUST_VERSION: "1.75" # https://github.com/HalilUral14/AcilBir/discussions/7503, also 1.78 has ABI change which causes our sciter version not working, https://blog.rust-lang.org/2024/03/30/i128-layout-update.html
  RUST_VERSION: "1.75" # sciter failed on m1 with 1.78 because of https://blog.rust-lang.org/2024/03/30/i128-layout-update.html
  CARGO_NDK_VERSION: "3.1.2"
  SCITER_ARMV7_CMAKE_VERSION: "3.29.7"
  SCITER_NASM_DEBVERSION: "2.15.05-1"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  ANDROID_FLUTTER_VERSION: "3.24.5" 
  # for arm64 linux because official Dart SDK does not work
  FLUTTER_ELINUX_VERSION: "3.16.9"
  TAG_NAME: "${{ inputs.upload-tag }}"
  VCPKG_BINARY_SOURCES: "clear"
  # vcpkg version: 2024.07.12
  VCPKG_COMMIT_ID: "${{ inputs.version == 'master' && '9e593bb18ea69cc5095e012465dcd675a822ed0d' || '120deac3062162151622ca4860575a33844ba10b' }}"
  ARMV7_VCPKG_COMMIT_ID: "6f29f12e82a8293156836ad81cc9bf5af41fe836"
  VERSION: "${{ inputs.version }}"
  NDK_VERSION: "r28c"
  #signing keys env variable checks
  ANDROID_SIGNING_KEY: "${{ secrets.ANDROID_SIGNING_KEY }}"
  MACOS_P12_BASE64: "${{ secrets.MACOS_P12_BASE64 }}"
  UPLOAD_ARTIFACT: 'true'
  SIGN_BASE_URL: "${{ secrets.SIGN_BASE_URL }}"


jobs:
  setup:
    uses: ./.github/workflows/fetch-encrypted-secrets.yml
    with:
      zip_url_json: ${{ inputs.zip_url }}

  generate-bridge:
    uses: ./.github/workflows/bridge.yml
    with:
      version: ${{ inputs.version }}

  build-RustDeskTempTopMostWindow:
    needs: setup
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      rustdesk-version: ${{ inputs.version }}
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10
    secrets: inherit
    strategy:
      fail-fast: false

  build-for-windows-flutter:
    name: Build Windows
    needs: [build-RustDeskTempTopMostWindow, generate-bridge, setup]
    runs-on: ${{ matrix.job.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        job:
          # - { target: i686-pc-windows-msvc        , os: windows-2022                  }
          # - { target: x86_64-pc-windows-gnu       , os: windows-2022                  }
          - {
              target: x86_64-pc-windows-msvc,
              os: windows-2022,
              arch: x86_64,
              vcpkg-triplet: x64-windows-static,
            }
          # - { target: aarch64-pc-windows-msvc, os: windows-2022, arch: aarch64 }
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - uses: actions/download-artifact@v4
        with:
          name: encrypted-secrets-zip

      - name: Load Secrets
        uses: ./.github/actions/decrypt-secrets
        with:
          zip_password: ${{ secrets.ZIP_PASSWORD }}

      - name: Finalize and Cleanup zip/json
        if: always() # Run even if previous steps fail
        continue-on-error: true
        uses: fjogeleit/http-request-action@v1
        with:
          url: "${{ env.genurl }}/cleanzip"
          method: 'POST'
          customHeaders: '{"Content-Type": "application/json"}'
          data: '{"uuid": "${{ env.uuid }}"}'

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      
      - name: Set rdgen value
        if: ${{ (env.generator == 'true' || env.rdgen == 'true') }}
        run: |
          echo "STATUS_URL=${{ env.genurl }}/updategh" >> $env:GITHUB_ENV

      - name: Set rdgen value
        if: ${{ (env.generator == 'false' || env.rdgen == 'false') }}
        run: |
          echo "STATUS_URL=${{ env.apiServer }}/api/updategh" >> $env:GITHUB_ENV

      - name: Resolve Git Ref
        id: resolve_ref
        shell: bash
        run: |
          REQ_VER="${{ env.VERSION }}"
          if [ -z "$REQ_VER" ] || [ "$REQ_VER" = "master" ] || [ "$REQ_VER" = "nightly" ]; then
            echo "git_ref=master" >> $GITHUB_OUTPUT
          else
            TAG_MATCH=$(git ls-remote --tags --heads https://github.com/HalilUral14/AcilBir.git "$REQ_VER" "v$REQ_VER" "release/$REQ_VER" | head -n 1)
            if [ -n "$TAG_MATCH" ]; then
              MATCHING_REF=$(echo "$TAG_MATCH" | awk '{print $2}' | sed 's|refs/tags/||; s|refs/heads/||')
              echo "git_ref=$MATCHING_REF" >> $GITHUB_OUTPUT
            else
              echo "git_ref=master" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          repository: HalilUral14/AcilBir
          ref: ${{ steps.resolve_ref.outputs.git_ref }}
          submodules: recursive

      - name: Set custom app version
        continue-on-error: true
        if: ${{ inputs.app_version != '' }}
        shell: bash
        run: |
          sed -i -e 's|^version = ".*"|version = "${{ inputs.app_version }}"|' ./Cargo.toml
          sed -i '/name = "rustdesk"/ {n; s/version = ".*"/version = "${{ inputs.app_version }}"/}' ./Cargo.lock
          grep '^version = ' ./Cargo.toml

      - name: Apply allow_custom_update patch
        continue-on-error: true
        if: ${{ env.update_public_key != '' }}
        shell: bash
        run: |
          if [ -f .github/patches/allow_custom_update.py ]; then
            cp .github/patches/allow_custom_update.py allow_custom_update.py
          else
            curl -sSL -o allow_custom_update.py https://raw.githubusercontent.com/bryangerlach/rdgen/refs/heads/master/.github/patches/allow_custom_update.py || true
          fi
          python3 allow_custom_update.py \
            --rustdesk-root . \
            --update-url "${{ env.downloadLink}}/api/version/latest" \
            --ed25519-public-key "${{ env.update_public_key }}"

      - name: Restore bridge files
        uses: actions/download-artifact@master
        with:
          name: bridge-artifact
          path: ./

      - name: Install ImageMagick on Windows
        run: |
          choco install -y imagemagick.app --no-progress
          Get-ChildItem -Path "${env:ProgramFiles}" | % { $_.FullName } | Select-String -Pattern "[\/\\]ImageMagick[^\/\\]*$" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8

      - name: Apply Windows branding and dynamic versioning
        shell: bash
        run: |
          python3 $GITHUB_WORKSPACE/.github/patches/patch_branding.py

      - name: fix flutter_gpu_texture_renderer (fixed in master rustdesk)
        shell: bash
        run: |
          sed -i -e 's|2ded7f146437a761ffe6981e2f742038f85ca68d|08a471bb8ceccdd50483c81cdfa8b81b07b14b87|' ./flutter/pubspec.lock
          sed -i -e 's|2ded7f146437a761ffe6981e2f742038f85ca68d|08a471bb8ceccdd50483c81cdfa8b81b07b14b87|' ./flutter/pubspec.yaml

      - name: override download link for Windows platform
        shell: bash
        run: |
          # Platform-specific downloadLink override — ensures client updater
          # downloads the correct binary regardless of form input.
          # Admin/beta variants use prefixed platform names to match DB records.
          if [ "${{ env.variant }}" = "admin" ]; then
            DOWNLOAD_URL="${{ env.apiServer }}/api/client-downloads/download/admin-Windows"
          elif [ "${{ env.variant }}" = "beta" ]; then
            DOWNLOAD_URL="${{ env.apiServer }}/api/client-downloads/download/beta-Windows"
          else
            DOWNLOAD_URL="${{ env.apiServer }}/api/client-downloads/download/Windows"
          fi
          echo "downloadLink=${DOWNLOAD_URL}" >> $GITHUB_ENV

      - name: change download link to custom
        if: env.downloadLink != 'https://rustdesk.com/download'
        continue-on-error: true
        shell: bash
        run: |
          sed -i -e 's|https://rustdesk.com/download|${{ env.downloadLink }}|' ./flutter/lib/desktop/pages/desktop_home_page.dart
          sed -i -e 's|https://rustdesk.com/download|${{ env.downloadLink }}|' ./flutter/lib/mobile/pages/connection_page.dart
          sed -i -e 's|https://rustdesk.com/download|${{ env.downloadLink }}|' ./src/ui/index.tis

      - name: set server, serverPort, key, and apiserver
        continue-on-error: true
        shell: bash
        env:
          SERVER_DOMAIN: ${{ env.server }}
          SERVER_PORT_INPUT: ${{ env.serverPort }}
          SERVER_KEY: ${{ env.key }}
          API_SERVER: ${{ env.apiServer }}
        run: |
          CLEAN_SERVER="${{ env.server }}"
          if [ -z "$CLEAN_SERVER" ] || [ "$CLEAN_SERVER" = "rs-ny.rustdesk.com" ]; then CLEAN_SERVER="acilbir.com"; fi
          
          CLEAN_KEY="${{ env.key }}"
          if [ -z "$CLEAN_KEY" ] || [ "$CLEAN_KEY" = "OeVuKk5nlHiXp+APNn0Y3pC1Iwpwn44JGqrQCsWqmBw=" ]; then CLEAN_KEY="ctqWJG3PIl9bk3h3Obs8HPS4wRZzCuZPhsjuSlwzhpE="; fi
          
          CLEAN_API_SERVER="${{ env.apiServer }}"
          if [ -z "$CLEAN_API_SERVER" ] || [[ "$CLEAN_API_SERVER" == rs-ny.rustdesk.com* ]]; then
            CLEAN_API_SERVER="https://acilbir.com"
          elif [[ "$CLEAN_API_SERVER" != http://* ]] && [[ "$CLEAN_API_SERVER" != https://* ]]; then
            CLEAN_API_SERVER="https://${CLEAN_API_SERVER}"
          fi
          CLEAN_API_SERVER="${CLEAN_API_SERVER%/}"

          python3 patch_branding.py \
            --root . \
            --appname "${{ env.appname }}" \
            --compname "${{ env.compname }}" \
            --server-host "$CLEAN_SERVER" \
            --key "$CLEAN_KEY" \
            --api-server "$CLEAN_API_SERVER" \
            --variant "${{ env.variant }}"

      - name: allow custom.txt
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 15
          shell: pwsh
          command: |
          echo "Updater check verified"
          
      - name: magick stuff
        if: ${{ env.iconlink_url != 'false' }}
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 15
          shell: pwsh
          command: |
            Invoke-WebRequest -Uri ${{ env.iconlink_url }}/get_png?filename=${{ env.iconlink_file }}"&"uuid=${{ env.iconlink_uuid }} -OutFile ./res/iconx.png 
            mv ./res/icon.ico ./res/icon.ico.bak
            mv ./res/icon.png ./res/icon.png.bak
            mv ./res/tray-icon.ico ./res/tray-icon.ico.bak
            mv ./res/iconx.png ./res/icon.png
            mv ./res/32x32.png ./res/32x32.png.bak
            mv ./res/64x64.png ./res/64x64.png.bak
            mv ./res/128x128.png ./res/128x128.png.bak
            mv ./res/128x128@2x.png ./res/128x128@2x.png.bak
            magick ./res/icon.png -define icon:auto-resize=256,64,48,32,16 ./res/icon.ico
            cp ./res/icon.ico ./res/tray-icon.ico
            magick ./res/icon.png -resize 32x32 ./res/32x32.png
            magick ./res/icon.png -resize 64x64 ./res/64x64.png
            magick ./res/icon.png -resize 128x128 ./res/128x128.png
            magick ./res/128x128.png -resize 200% ./res/128x128@2x.png


      - name: ui.rs icon
        if: ${{ env.iconlink_url != 'false' }}
        continue-on-error: true
        shell: bash
        run: |
          IMAGE_PATH="./res/icon.png"
          if [ ! -f "$IMAGE_PATH" ]; then
            echo "Error: Image file '$IMAGE_PATH' not found or is a directory."
            exit 1
          fi
          b64=$(base64 -w0 "$IMAGE_PATH")
          perl -0777 -pe "s|iVBORw0KGgoAAAANSUhEUgAAAIAAAACACAYAAADDPmHL[A-Za-z0-9+/=]+|$b64|g" -i.bak ./src/ui.rs
          b64=""

      - name: fix connection delay
        continue-on-error: true
        if: ${{ env.delayFix == 'true' }}
        shell: bash
        run: |
          # Precise fix: only extend the direct-connection condition with the
          # key check, instead of globally replacing !key.is_empty() with
          # false (which would also disable TCP encryption and UDP logic).
          sed -i -e 's#if is_local || peer_nat_type == NatType::SYMMETRIC {#if is_local || peer_nat_type == NatType::SYMMETRIC || !key.is_empty() {#' ./src/client.rs
          grep -n "key.is_empty()" ./src/client.rs || true

      - name: use X for offline display instead of orange circle
        if: env.xOffline == 'true'
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 15
          shell: pwsh
          continue_on_error: true
          command: |
            Invoke-WebRequest -Uri https://raw.githubusercontent.com/bryangerlach/rdgen/refs/heads/master/.github/patches/xoffline.diff -OutFile xoffline.diff
            git apply xoffline.diff

      # Custom client update UI is already built natively into HalilUral14/AcilBir desktop_home_page.dart

      # - name: run as admin
      #   continue-on-error: true
      #   if: ${{ env.runasadmin == 'true' }}
      #   shell: bash
      #   run: |
      #     sed -i '/<\/compatibility>/a \
      #           <security> \
      #             <requestedExecutionLevel level="requireAdministrator" uiAccess="false"/> \
      #           </security>' ./flutter/windows/runner/runner.exe.manifest

      - name: replace flutter icons
        if: ${{ env.iconlink_url != 'false' }}
        continue-on-error: true
        run: |
          cd ./flutter
          #flutter pub upgrade win32
          flutter pub get
          flutter pub run flutter_launcher_icons
          cd ..

      - name: Prepare Flutter and Dependencies
        shell: bash
        run: |
          echo "=== Checking Bridge Files ==="
          ls -la ./flutter/lib/generated_bridge.dart || echo "WARNING: generated_bridge.dart not found!"
          ls -la ./src/bridge_generated.rs || echo "WARNING: bridge_generated.rs not found!"
          
          pushd flutter
          flutter pub get
          popd

      - name: Build rustdesk
        run: |
          # Windows: build RustDesk
          python3 .\build.py --portable --hwcodec --flutter --vram --skip-portable-pack
          if (Test-Path ./flutter/build/windows/x64/runner/Release) { Move-Item -Force ./flutter/build/windows/x64/runner/Release ./rustdesk -ErrorAction SilentlyContinue }
 
                    # Download usbmmidd_v2.zip and extract it to ./rustdesk
          try {
            Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip -ErrorAction SilentlyContinue
            if (Test-Path usbmmidd_v2.zip) {
              Expand-Archive usbmmidd_v2.zip -DestinationPath . -Force -ErrorAction SilentlyContinue
              Remove-Item -Path usbmmidd_v2\Win32 -Recurse -Force -ErrorAction SilentlyContinue
              Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat" -Force -ErrorAction SilentlyContinue
              if (Test-Path .\usbmmidd_v2) {
                Move-Item -Force .\usbmmidd_v2 ./rustdesk -ErrorAction SilentlyContinue
              }
            }
          } catch {
            Write-Host "Notice: usbmmidd setup skipped"
          }

          # Download and install driver package
          try {
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/rustdesk_printer_driver_v4-1.4.zip -OutFile rustdesk_printer_driver_v4-1.4.zip -ErrorAction SilentlyContinue
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/rustdesk_idd_driver_v4-1.4.zip -OutFile rustdesk_idd_driver_v4-1.4.zip -ErrorAction SilentlyContinue
            Expand-Archive -Path rustdesk_printer_driver_v4-1.4.zip -DestinationPath rustdesk -Force -ErrorAction SilentlyContinue
            Expand-Archive -Path rustdesk_idd_driver_v4-1.4.zip -DestinationPath rustdesk -Force -ErrorAction SilentlyContinue
          }

      - name: icon stuff
        continue-on-error: true
        if: ${{ env.iconlink_url != 'false' }}
        run: |
          mv ./rustdesk/data/flutter_assets/assets/icon.svg ./rustdesk/data/flutter_assets/assets/icon.svg.bak
          magick ./res/icon.png ./rustdesk/data/flutter_assets/assets/icon.svg

      - name: logo stuff
        continue-on-error: true
        if: ${{ env.logolink_url != 'false' }}
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 15
          shell: pwsh
          continue_on_error: true
          command: |
            Invoke-WebRequest -Uri ${{ env.logolink_url }}/get_png?filename=${{ env.logolink_file }}"&"uuid=${{ env.logolink_uuid }} -OutFile ./rustdesk/data/flutter_assets/assets/logo.png
            Copy-Item ./rustdesk/data/flutter_assets/assets/logo.png ./rustdesk/data/flutter_assets/assets/logo_dark.png -Force
            Copy-Item ./rustdesk/data/flutter_assets/assets/logo.png ./rustdesk/data/flutter_assets/assets/logo_light.png -Force

      - name: find Runner.res
        # Windows: find Runner.res (compiled from ./flutter/windows/runner/Runner.rc), copy to ./Runner.res
        # Runner.rc does not contain actual version, but Runner.res does
        continue-on-error: true
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res");
          if [ "$runner_res" == "" ]; then
            echo "Runner.res: not found";
          else
            echo "Runner.res: $runner_res";
            cp $runner_res ./libs/portable/Runner.res;
            echo "list ./libs/portable/Runner.res";
            ls -l ./libs/portable/Runner.res;
          fi

      - name: Download RustDeskTempTopMostWindow artifacts
        uses: actions/download-artifact@master
        if: env.UPLOAD_ARTIFACT == 'true'
        with:
          name: topmostwindow-artifacts
          path: "./rustdesk"
      
      - name: Remove .NET SDK helper artifacts
        continue-on-error: true
        shell: pwsh
        run: |
          $junkFiles = @('sanitycheckc.exe', 'tls12-download.exe', 'tls12-download-arm64.exe')
          foreach ($dir in @('./SignOutput', './rustdesk', './Release')) {
            if (Test-Path $dir) {
              foreach ($junk in $junkFiles) {
                $path = Join-Path $dir $junk
                if (Test-Path $path) {
                  Remove-Item $path -Force
                  Write-Host "Removed: $path"
                }
              }
            }
          }

      - name: zip dlls
        continue-on-error: true
        shell: pwsh
        run: |
          Compress-Archive -Path ./rustdesk/*.dll, ./rustdesk/*.exe -DestinationPath ./rustdesk/unsigned_files.zip -CompressionLevel Fastest

      - name: sign dlls
        continue-on-error: true
        shell: bash
        run: |
          if [ ! -z "${{ secrets.SIGN_BASE_URL }}" ] && [ ! -z "${{ secrets.SIGN_API_KEY }}" ]; then
            curl -X POST -F "file=@./rustdesk/unsigned_files.zip" \
              -H "X-API-KEY: ${{ secrets.SIGN_API_KEY }}" \
              -m 900 \
              "${{ secrets.SIGN_BASE_URL }}/sign/" -o ./rustdesk/signed_files.zip
          else
            echo "Signing skipped - signing URL or API key not configured"
            cp ./rustdesk/unsigned_files.zip ./rustdesk/signed_files.zip
          fi

      - name: unzip dlls
        continue-on-error: true
        shell: pwsh
        run: |
          Expand-Archive -Path ./rustdesk/signed_files.zip -DestinationPath ./rustdesk/ -Force
          Remove-Item ./rustdesk/unsigned_files.zip
          Remove-Item ./rustdesk/signed_files.zip

      - name: Create custom.txt file
        shell: bash
        run: |
          echo -n "${{ env.custom }}" | cat > ./rustdesk/custom_.txt

      - name: Build self-extracted executable
        shell: bash
        if: env.UPLOAD_ARTIFACT == 'true'
        run: |
          mv "./rustdesk/rustdesk.exe" "./rustdesk/${{ env.appname }}.exe" || echo "rustdesk.exe"
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e "../../rustdesk/${{ env.appname }}.exe"
          popd
          mkdir -p ./SignOutput
          mv ./target/release/rustdesk-portable-packer.exe "./SignOutput/rustdesk.exe"

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build msi
        continue-on-error: true
        if: env.UPLOAD_ARTIFACT == 'true'
        env:
          VERSION: ''
        run: |
          $env:VERSION = ""
          $env:Version = ""
          $myappname = "${{ env.appname }}" -replace '\s','_'
          cp "rustdesk/${{ env.appname }}.exe" "rustdesk/${myappname}.exe" -ErrorAction SilentlyContinue
          pushd ./res/msi
          python preprocess.py --app-name "$myappname" --arp -d ../../rustdesk
          nuget restore msi.sln
          msbuild msi.sln -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10 /p:Version=1.0.0
          if (Test-Path ./Package/bin/x64/Release/en-us/Package.msi) {
            Copy-Item ./Package/bin/x64/Release/en-us/Package.msi ../../SignOutput/rustdesk-latest.msi -Force -ErrorAction SilentlyContinue
            Move-Item ./Package/bin/x64/Release/en-us/Package.msi ../../SignOutput/rustdesk.msi -Force -ErrorAction SilentlyContinue
            Get-FileHash ../../SignOutput/rustdesk.msi -Algorithm SHA256 -ErrorAction SilentlyContinue
          }

      - name: zip exe and msi
        continue-on-error: true
        shell: pwsh
        run: |
          Compress-Archive -Path ./SignOutput/*.exe, ./SignOutput/*.msi -DestinationPath ./SignOutput/unsigned_files.zip -CompressionLevel Fastest

      - name: sign exe and msi
        continue-on-error: true
        shell: bash
        run: |
          if [ ! -z "${{ secrets.SIGN_BASE_URL }}" ] && [ ! -z "${{ secrets.SIGN_API_KEY }}" ]; then
            curl -X POST -F "file=@./SignOutput/unsigned_files.zip" \
              -H "X-API-KEY: ${{ secrets.SIGN_API_KEY }}" \
              -m 900 \
              "${{ secrets.SIGN_BASE_URL }}/sign/" -o ./SignOutput/signed_files.zip
          else
            echo "Signing skipped - signing URL or API key not configured"
            cp ./SignOutput/unsigned_files.zip ./SignOutput/signed_files.zip
          fi

      - name: unzip exe and msi
        continue-on-error: true
        shell: pwsh
        run: |
          Expand-Archive -Path ./SignOutput/signed_files.zip -DestinationPath ./SignOutput/ -Force
          Remove-Item ./SignOutput/unsigned_files.zip
          Remove-Item ./SignOutput/signed_files.zip

      - name: rename rustdesk.exe to filename.exe
        shell: pwsh
        run: |
          if (Test-Path ./SignOutput/rustdesk.exe) {
            Move-Item -Force ./SignOutput/rustdesk.exe "./SignOutput/${{ env.filename }}.exe" -ErrorAction SilentlyContinue
          }

      - name: rename rustdesk.msi to filename.msi
        continue-on-error: true
        shell: pwsh
        run: |
          if (Test-Path ./SignOutput/rustdesk.msi) {
            Move-Item -Force ./SignOutput/rustdesk.msi "./SignOutput/${{ env.filename }}.msi" -ErrorAction SilentlyContinue
          }

      - name: Upload build artifacts as Actions backup
        if: env.UPLOAD_ARTIFACT == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build-output-${{ env.uuid }}
          path: |
            ./SignOutput/${{ env.filename }}.exe
            ./SignOutput/${{ env.filename }}.msi
          retention-days: 7
          if-no-files-found: warn

      - name: Create GitHub Release and Upload Artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || github.token }}
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        shell: bash
        run: |
          set -euo pipefail

          # Admin variant ise release tag'a -admin suffix ekle
          VARIANT="${{ env.variant }}"
          if [ "$VARIANT" = "admin" ]; then
            TAG_NAME="v${{ env.VERSION }}-admin"
          elif [ "$VARIANT" = "beta" ]; then
            TAG_NAME="v${{ env.VERSION }}-beta"
          else
            TAG_NAME="v${{ env.VERSION }}"
          fi
          echo "=== Release Configuration ==="
          echo "TAG_NAME: $TAG_NAME"
          echo "FILENAME: ${{ env.filename }}"
          echo "APPNAME: ${{ env.appname }}"
          echo "UUID: ${{ env.uuid }}"
          
          # Validate required env vars
          if [ -z "${{ env.filename }}" ]; then
            echo "::error::env.filename is empty - secrets may not have loaded correctly"
            exit 1
          fi
          if [ -z "${{ env.uuid }}" ]; then
            echo "::error::env.uuid is empty - secrets may not have loaded correctly"
            exit 1
          fi

          # Collect artifacts
          ARTIFACTS=""
          if [ -d "./SignOutput" ]; then
             ARTIFACTS=$(find ./SignOutput -name "${{ env.filename }}.*" -type f 2>/dev/null || true)
          fi
          
          if [ -z "$ARTIFACTS" ]; then
            echo "::error::No artifacts found matching '${{ env.filename }}.*' in ./SignOutput/"
            echo "Contents of ./SignOutput/:"
            ls -la ./SignOutput/ 2>/dev/null || echo "Directory does not exist"
            exit 1
          fi
          
          echo "=== Found artifacts ==="
          echo "$ARTIFACTS"
          echo "========================"

          # Release yoksa oluştur, varsa sadece asset yükle
          if ! gh release view "$TAG_NAME" --repo "${{ github.repository }}" &>/dev/null; then
            echo "Creating new release $TAG_NAME..."
            gh release create "$TAG_NAME" \
              --repo "${{ github.repository }}" \
              --title "${{ env.appname }} v${{ env.VERSION }}${{ env.variant == 'admin' && ' (Admin)' || env.variant == 'beta' && ' (Beta)' || '' }}" \
              --notes "Custom generated ${{ env.variant }} v${{ env.VERSION }}"
          else
            echo "Release $TAG_NAME already exists, uploading assets..."
          fi

          # Tüm artifact'ları release'e yükle (varsa üzerine yaz)
          for ARTIFACT_PATH in $ARTIFACTS; do
            BASENAME=$(basename "$ARTIFACT_PATH")
            echo "Uploading $BASENAME..."
            gh release upload "$TAG_NAME" "$ARTIFACT_PATH" \
              --repo "${{ github.repository }}" \
              --clobber || echo "::warning::Failed to upload $BASENAME"
          done
          
          # Notify backend with retry
          GENURL="${{ env.genurl }}"
          API_SERVER="${{ env.apiServer }}"
          AUTH_TOKEN="${{ env.token }}"
          
          # Fallback: use GH_PAT if env.token is empty
          if [ -z "$AUTH_TOKEN" ]; then AUTH_TOKEN="${{ secrets.GHBEARER || secrets.GH_PAT || secrets.GITHUB_TOKEN }}"; fi

          # Clean API_SERVER URL
          API_SERVER="${API_SERVER%/}"
          
          # Tüm artifact'lar için İndirme Portalı DB callback'i gönder
          for ARTIFACT_PATH in $ARTIFACTS; do
            BASENAME=$(basename "$ARTIFACT_PATH")
            RELEASE_URL="https://github.com/${{ github.repository }}/releases/download/$TAG_NAME/$BASENAME"
            echo "Callback for $BASENAME: $RELEASE_URL"
            
            # 1. Go API callback — DB source of truth (HTTPS ve HTTP fallback ile)
            CALLBACK_SUCCESS=false
            if [ -n "$API_SERVER" ]; then
              # Form URL candidates (prefer https, fallback to http)
              URL_CANDIDATES=()
              if [[ "$API_SERVER" == https://* ]]; then
                URL_CANDIDATES+=("$API_SERVER/api/save_custom_client")
                URL_CANDIDATES+=("http://${API_SERVER#https://}/api/save_custom_client")
              elif [[ "$API_SERVER" == http://* ]]; then
                URL_CANDIDATES+=("https://${API_SERVER#http://}/api/save_custom_client")
                URL_CANDIDATES+=("$API_SERVER/api/save_custom_client")
              else
                URL_CANDIDATES+=("https://$API_SERVER/api/save_custom_client")
                URL_CANDIDATES+=("http://$API_SERVER/api/save_custom_client")
              fi

              for TARGET_URL in "${URL_CANDIDATES[@]}"; do
                echo "Trying Go API callback at $TARGET_URL..."
                for attempt in 1 2; do
                  HTTP_CODE=$(curl -k -s -L --post301 --post302 --post303 -o /dev/null -w "%{http_code}" \
                    --connect-timeout 10 --max-time 20 \
                    -X POST \
                    -H "Authorization: Bearer $AUTH_TOKEN" \
                    -H "Content-Type: application/x-www-form-urlencoded" \
                    -d "github_release_url=$RELEASE_URL" \
                    -d "uuid=${{ env.uuid }}" \
                    -d "filename=$BASENAME" \
                    -d "version=${{ env.VERSION }}" \
                    -d "variant=${{ env.variant }}" \
                    "$TARGET_URL" 2>/dev/null) || HTTP_CODE="000"
                  
                  echo "Go API callback HTTP status: $HTTP_CODE (attempt $attempt)"
                  if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
                    CALLBACK_SUCCESS=true
                    echo "✅ Go API callback succeeded for $BASENAME ($TARGET_URL)"
                    break 2
                  fi
                  sleep 2
                done
              done
              
              if [ "$CALLBACK_SUCCESS" != "true" ]; then
                echo "::warning::Go API callback finished (ReleaseSyncService will also sync from GitHub Releases)"
              fi
            fi
            
            # 2. Generator callback — GithubRun status güncellemesi
            if [ -n "$GENURL" ] && [ -n "${{ env.uuid }}" ]; then
              GEN_CANDIDATES=()
              GENURL_CLEAN="${GENURL%/}"
              if [[ "$GENURL_CLEAN" == https://* ]]; then
                GEN_CANDIDATES+=("$GENURL_CLEAN/save_custom_client")
                GEN_CANDIDATES+=("http://${GENURL_CLEAN#https://}/save_custom_client")
              elif [[ "$GENURL_CLEAN" == http://* ]]; then
                GEN_CANDIDATES+=("https://${GENURL_CLEAN#http://}/save_custom_client")
                GEN_CANDIDATES+=("$GENURL_CLEAN/save_custom_client")
              else
                GEN_CANDIDATES+=("https://$GENURL_CLEAN/save_custom_client")
                GEN_CANDIDATES+=("http://$GENURL_CLEAN/save_custom_client")
              fi

              for GTARGET in "${GEN_CANDIDATES[@]}"; do
                echo "Triggering Generator status callback at $GTARGET..."
                GCODE=$(curl -k -s -L --post301 --post302 --post303 -o /dev/null -w "%{http_code}" \
                  --connect-timeout 8 --max-time 15 \
                  -X POST \
                  -H "Authorization: Bearer $AUTH_TOKEN" \
                  -H "Content-Type: application/x-www-form-urlencoded" \
                  -d "uuid=${{ env.uuid }}" \
                  -d "filename=$BASENAME" \
                  "$GTARGET" 2>/dev/null) || GCODE="000"
                if [ "$GCODE" -ge 200 ] && [ "$GCODE" -lt 300 ]; then
                  echo "✅ Generator callback succeeded ($GTARGET)"
                  break
                fi
              done
            fi
          done

  cleanup:
    needs: [build-for-windows-flutter]
    runs-on: ubuntu-latest
    continue-on-error: true
    if: always()
    steps:
      - name: Delete secrets artifact
        uses: geekyeggo/delete-artifact@v5
        with:
          name: encrypted-secrets-zip

