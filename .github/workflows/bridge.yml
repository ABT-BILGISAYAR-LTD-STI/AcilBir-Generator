# This yaml shares the build bridge steps with ci and nightly.
name: Build flutter-rust-bridge
# 2023-11-23 18:00:00+00:00

on:
  workflow_call:
    inputs:
      version:
        description: 'Rustdesk Version'
        required: true
        default: '1.3.1'
        type: string

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_VERSION: "3.22.3"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  RUST_VERSION: "1.75" # https://github.com/HalilUral14/AcilBir/discussions/7503

jobs:
  generate_bridge:
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          - {
              target: x86_64-unknown-linux-gnu,
              os: ubuntu-24.04,
              extra-build-args: "",
            }
    steps:
      - name: Resolve Git Ref
        id: resolve_ref
        shell: bash
        run: |
          REQ_VER="${{ inputs.version }}"
          if [ -z "$REQ_VER" ] || [ "$REQ_VER" = "master" ] || [ "$REQ_VER" = "nightly" ]; then
            echo "git_ref=master" >> $GITHUB_OUTPUT
          else
            TAG_MATCH=$(git ls-remote --tags --heads https://github.com/HalilUral14/AcilBir.git "$REQ_VER" "v$REQ_VER" "release/$REQ_VER" | head -n 1)
            if [ -n "$TAG_MATCH" ]; then
              MATCHING_REF=$(echo "$TAG_MATCH" | awk '{print $2}' | sed 's|refs/tags/||; s|refs/heads/||')
              echo "git_ref=$MATCHING_REF" >> $GITHUB_OUTPUT
            else
              echo "git_ref=master" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          repository: HalilUral14/AcilBir
          ref: ${{ steps.resolve_ref.outputs.git_ref }}
          submodules: recursive

      - name: Install prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libclang-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: bridge-${{ matrix.job.os }}

      - name: Cache bridge tools
        id: cache-bridge-tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-expand
            ~/.cargo/bin/flutter_rust_bridge_codegen
          key: bridge-tools-${{ env.CARGO_EXPAND_VERSION }}-${{ env.FLUTTER_RUST_BRIDGE_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install flutter rust bridge deps
        if: steps.cache-bridge-tools.outputs.cache-hit != 'true'
        shell: bash
        run: |
          # Fast pre-built binary installation with cargo-binstall
          if ! command -v cargo-binstall &> /dev/null; then
            curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash || true
          fi
          
          if command -v cargo-binstall &> /dev/null; then
            cargo-binstall --no-confirm cargo-expand@${{ env.CARGO_EXPAND_VERSION }} || cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
            cargo-binstall --no-confirm flutter_rust_bridge_codegen@${{ env.FLUTTER_RUST_BRIDGE_VERSION }} || cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          else
            cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
            cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          fi

      - name: Prepare Flutter packages
        shell: bash
        run: |
          pushd flutter && sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' pubspec.yaml && flutter pub get && popd

      - name: Run flutter rust bridge
        run: |
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - name: Upload Artifact
        uses: actions/upload-artifact@master
        with:
          name: bridge-artifact
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart
            ./flutter/macos/Runner/bridge_generated.h
            ./flutter/ios/Runner/bridge_generated.h
