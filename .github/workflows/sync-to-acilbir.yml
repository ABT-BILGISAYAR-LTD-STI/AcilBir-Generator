# ===============================================================================
# AcilBir-Generator Repo -> AcilBir.com Otomatik Senkronizasyon
# ===============================================================================
# AcilBir-Generator reposuna push yapildiginda, degisiklikleri
# AcilBir.com monorepo'sundaki acilbir-pro/acilbir-generator/ klasorune yansitir.
# Loop onleme: [skip-sync] marker'li commit'lerde calismaz.

name: Sync AcilBir-Generator to AcilBir.com

on:
  push:
    branches: [main]

jobs:
  sync-to-acilbir:
    name: Sync to AcilBir.com
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip-sync]')"
    steps:
      - name: Checkout generator (current repo)
        uses: actions/checkout@v4
        with:
          path: rdgen

      - name: Checkout AcilBir.com
        uses: actions/checkout@v4
        with:
          repository: ABT-BILGISAYAR-LTD-STI/AcilBir.com
          token: ${{ secrets.ACILBIR_SYNC_TOKEN || secrets.RDGEN_SYNC_TOKEN }}
          path: acilbir

      - name: Sync files
        run: |
          # AcilBir.com'daki generator klasorunu temizle (.git haric, zaten yok)
          rm -rf acilbir/acilbir-pro/acilbir-generator
          mkdir -p acilbir/acilbir-pro/acilbir-generator

          # generator reposunun icerigini kopyala (.git haric)
          rsync -a --exclude='.git' rdgen/ acilbir/acilbir-pro/acilbir-generator/

      - name: Commit and push
        working-directory: acilbir
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "Zaten senkronize, degisiklik yok."
            exit 0
          fi

          git commit -m "[skip-sync] Sync from AcilBir-Generator ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push
          echo "AcilBir.com reposuna senkronize edildi."
