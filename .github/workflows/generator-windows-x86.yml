name: Custom Windows x86 Client Generator
run-name: Custom Windows x86 Client Generator
on: 
  workflow_dispatch:
    inputs:
      version:
        description: 'version to buld'
        required: true
        default: ''
        type: string
      zip_url:
        description: 'url to zip of json'
        required: true
        default: ''
        type: string
      app_version:
        description: 'custom app version string (overrides build version)'
        required: false
        default: ''
        type: string

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
  SCITER_RUST_VERSION: "1.75" # https://github.com/HalilUral14/AcilBir/discussions/7503, also 1.78 has ABI change which causes our sciter version not working, https://blog.rust-lang.org/2024/03/30/i128-layout-update.html
  RUST_VERSION: "1.75" # sciter failed on m1 with 1.78 because of https://blog.rust-lang.org/2024/03/30/i128-layout-update.html
  MAC_RUST_VERSION: "1.81" # 1.81 is requred for macos, because of https://github.com/yury/cidre requires 1.81
  CARGO_NDK_VERSION: "3.1.2"
  SCITER_ARMV7_CMAKE_VERSION: "3.29.7"
  SCITER_NASM_DEBVERSION: "2.15.05-1"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  ANDROID_FLUTTER_VERSION: "3.24.5"
  # for arm64 linux because official Dart SDK does not work
  FLUTTER_ELINUX_VERSION: "3.16.9"
  TAG_NAME: "${{ inputs.upload-tag }}"
  VCPKG_BINARY_SOURCES: "clear"
  # vcpkg version: 2025.08.27
  # If we change the `VCPKG COMMIT_ID`, please remember:
  # 1. Call `$VCPKG_ROOT/vcpkg x-update-baseline` to update the baseline in `vcpkg.json`.
  #  Or we may face build issue like 
  #  https://github.com/HalilUral14/AcilBir/actions/runs/14414119794/job/40427970174
  # 2. Update the `VCPKG_COMMIT_ID` in `ci.yml` and `playground.yml`.
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  ARMV7_VCPKG_COMMIT_ID: "6f29f12e82a8293156836ad81cc9bf5af41fe836" # 2025.01.13, got "/opt/artifacts/vcpkg/vcpkg: No such file or directory" with latest version
  VERSION: "${{ inputs.version }}"
  NDK_VERSION: "r28c"
  #signing keys env variable checks
  ANDROID_SIGNING_KEY: "${{ secrets.ANDROID_SIGNING_KEY }}"
  MACOS_P12_BASE64: "${{ secrets.MACOS_P12_BASE64 }}"
  UPLOAD_ARTIFACT: 'true'
  SIGN_BASE_URL: "${{ secrets.SIGN_BASE_URL }}"

jobs:
  setup:
    uses: ./.github/workflows/fetch-encrypted-secrets.yml
    with:
      zip_url_json: ${{ inputs.zip_url }}

  build-for-windows-sciter:
    name: ${{ matrix.job.target }} (${{ matrix.job.os }})
    needs: setup
    runs-on: ${{ matrix.job.os }}
    permissions:
      contents: write
    # Temporarily disable this action due to additional test is needed.
    # if: false
    strategy:
      fail-fast: false
      matrix:
        job:
          # - { target: i686-pc-windows-msvc        , os: windows-2022                  }
          # - { target: x86_64-pc-windows-gnu       , os: windows-2022                  }
          - {
              target: i686-pc-windows-msvc,
              os: windows-2022,
              arch: x86,
              vcpkg-triplet: x86-windows-static,
            }
          # - { target: aarch64-pc-windows-msvc, os: windows-2022 }
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - uses: actions/download-artifact@v4
        with:
          name: encrypted-secrets-zip

      - name: Load Secrets
        uses: ./.github/actions/decrypt-secrets
        with:
          zip_password: ${{ secrets.ZIP_PASSWORD }}

      - name: Finalize and Cleanup zip/json
        if: always() # Run even if previous steps fail
        continue-on-error: true
        uses: fjogeleit/http-request-action@v1
        with:
          url: "${{ env.genurl }}/cleanzip"
          method: 'POST'
          customHeaders: '{"Content-Type": "application/json"}'
          data: '{"uuid": "${{ env.uuid }}"}'

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Set rdgen value
        if: ${{ (env.generator == 'true' || env.rdgen == 'true') }}
        run: |
          echo "STATUS_URL=${{ env.genurl }}/updategh" >> $env:GITHUB_ENV

      - name: Set rdgen value
        if: ${{ (env.generator == 'false' || env.rdgen == 'false') }}
        run: |
          echo "STATUS_URL=${{ env.apiServer }}/api/updategh" >> $env:GITHUB_ENV

      - name: Resolve Git Ref
        id: resolve_ref
        shell: bash
        run: |
          REQ_VER="${{ env.VERSION }}"
          if [ -z "$REQ_VER" ] || [ "$REQ_VER" = "master" ] || [ "$REQ_VER" = "nightly" ]; then
            echo "git_ref=master" >> $GITHUB_OUTPUT
          else
            TAG_MATCH=$(git ls-remote --tags --heads https://github.com/HalilUral14/AcilBir.git "$REQ_VER" "v$REQ_VER" "release/$REQ_VER" | head -n 1)
            if [ -n "$TAG_MATCH" ]; then
              MATCHING_REF=$(echo "$TAG_MATCH" | awk '{print $2}' | sed 's|refs/tags/||; s|refs/heads/||')
              echo "git_ref=$MATCHING_REF" >> $GITHUB_OUTPUT
            else
              echo "git_ref=master" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          repository: HalilUral14/AcilBir
          ref: ${{ steps.resolve_ref.outputs.git_ref }}
          submodules: recursive

      - name: Set custom app version
        continue-on-error: true
        if: ${{ inputs.app_version != '' }}
        shell: bash
        run: |
          sed -i -e 's|^version = ".*"|version = "${{ inputs.app_version }}"|' ./Cargo.toml
          sed -i '/name = "rustdesk"/ {n; s/version = ".*"/version = "${{ inputs.app_version }}"/}' ./Cargo.lock
          grep '^version = ' ./Cargo.toml

      - name: Apply allow_custom_update patch
        continue-on-error: true
        if: ${{ env.update_public_key != '' }}
        shell: bash
        run: |
          if [ -f .github/patches/allow_custom_update.py ]; then
            cp .github/patches/allow_custom_update.py allow_custom_update.py
          else
            curl -sSL -o allow_custom_update.py https://raw.githubusercontent.com/bryangerlach/rdgen/refs/heads/master/.github/patches/allow_custom_update.py || true
          fi
          python3 allow_custom_update.py \
            --rustdesk-root . \
            --update-url "${{ env.downloadLink}}/api/version/latest" \
            --ed25519-public-key "${{ env.update_public_key }}"

      - name: Install ImageMagick on Windows
        run: |
          choco install -y imagemagick.app --no-progress
          Get-ChildItem -Path "${env:ProgramFiles}" | % { $_.FullName } | Select-String -Pattern "[\/\\]ImageMagick[^\/\\]*$" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8

      - name: Apply Windows x86 branding and dynamic versioning
        shell: bash
        run: |
          python3 $GITHUB_WORKSPACE/.github/patches/patch_branding.py

      - name: override download link for Windows x86 platform
        shell: bash
        run: |
          # Platform-specific downloadLink override
          if [ "${{ env.variant }}" = "admin" ]; then
            DOWNLOAD_URL="${{ env.apiServer }}/api/client-downloads/download/admin-Windows-x86"
          elif [ "${{ env.variant }}" = "beta" ]; then
            DOWNLOAD_URL="${{ env.apiServer }}/api/client-downloads/download/beta-Windows-x86"
          else
            DOWNLOAD_URL="${{ env.apiServer }}/api/client-downloads/download/Windows-x86"
          fi
          echo "downloadLink=${DOWNLOAD_URL}" >> $GITHUB_ENV

      - name: change download link to custom
        if: env.downloadLink != 'https://rustdesk.com/download'
        continue-on-error: true
        shell: bash
        run: |
          sed -i -e 's|https://rustdesk.com/download|${{ env.downloadLink }}|' ./src/ui/index.tis

      - name: set server, serverPort, key, and apiserver
        continue-on-error: true
        shell: bash
        env:
          SERVER_DOMAIN: ${{ env.server }}
          SERVER_PORT_INPUT: ${{ env.serverPort }}
          SERVER_KEY: ${{ env.key }}
          API_SERVER: ${{ env.apiServer }}
        run: |
          CLEAN_SERVER="${{ env.server }}"
          if [ -z "$CLEAN_SERVER" ] || [ "$CLEAN_SERVER" = "rs-ny.rustdesk.com" ]; then CLEAN_SERVER="acilbir.com"; fi
          
          CLEAN_KEY="${{ env.key }}"
          if [ -z "$CLEAN_KEY" ] || [ "$CLEAN_KEY" = "OeVuKk5nlHiXp+APNn0Y3pC1Iwpwn44JGqrQCsWqmBw=" ]; then CLEAN_KEY="ctqWJG3PIl9bk3h3Obs8HPS4wRZzCuZPhsjuSlwzhpE="; fi
          
          CLEAN_API_SERVER="${{ env.apiServer }}"
          if [ -z "$CLEAN_API_SERVER" ] || [[ "$CLEAN_API_SERVER" == rs-ny.rustdesk.com* ]]; then
            CLEAN_API_SERVER="https://acilbir.com"
          elif [[ "$CLEAN_API_SERVER" != http://* ]] && [[ "$CLEAN_API_SERVER" != https://* ]]; then
            CLEAN_API_SERVER="https://${CLEAN_API_SERVER}"
          fi
          CLEAN_API_SERVER="${CLEAN_API_SERVER%/}"

          CLEAN_URL_LINK="${{ env.urlLink }}"
          if [ -z "$CLEAN_URL_LINK" ]; then CLEAN_URL_LINK="https://acilbir.com"; fi

          CLEAN_COMPNAME="${{ env.compname }}"
          if [ -z "$CLEAN_COMPNAME" ]; then CLEAN_COMPNAME="ABT Bilgisayar Programlama ve Tic.Ltd.Sti."; fi

          python3 patch_branding.py \
            --root . \
            --appname "${{ env.appname }}" \
            --compname "$CLEAN_COMPNAME" \
            --server-host "$CLEAN_SERVER" \
            --key "$CLEAN_KEY" \
            --api-server "$CLEAN_API_SERVER" \
            --variant "${{ env.variant }}"
          sed -i -e 's|<span>{translate("Ready")}, <span .link #setup-server>{translate("setup_server_tip")}</span></span>|translate("Ready")|' ./src/ui/index.tis



      - name: add key recovery module
        shell: bash
        run: |
          cat > ./src/key_recovery.rs << 'KEY_RECOVERY_EOF'
          // Remote config module — fetches updated server configuration via HTTP
          // from the API server endpoint. This allows clients to dynamically
          // update key, ID server, and relay server without needing a rebuild.
          //
          // The module writes updated values via Config::set_option(), which
          // stores them in RustDesk2.toml [options] section. These values
          // override DEFAULT_SETTINGS (custom.txt default mode) at runtime.

          use hbb_common::config::Config;
          use hbb_common::log;
          use std::time::Duration;

          const MAX_RETRY_ATTEMPTS: usize = 3;
          const RETRY_DELAYS_SECS: [u64; 3] = [5, 15, 45];

          #[derive(serde::Deserialize)]
          struct ServerConfigResponse {
              key: Option<String>,
              #[serde(default)]
              id_server: Option<String>,
              #[serde(default)]
              relay: Option<String>,
              #[serde(default)]
              api_server: Option<String>,
          }

          /// Fetches the current server configuration from the API endpoint.
          /// Updates key, custom-rendezvous-server, and relay-server via
          /// Config::set_option() which writes to RustDesk2.toml [options].
          /// Returns true if any config value was updated.
          pub fn fetch_and_update_config(api_server: &str) -> bool {
              let url = format!(
                  "{}/api/server-key",
                  api_server.trim_end_matches('/')
              );

              log::info!("remote_config: checking {}", url);

              let client = match reqwest::blocking::Client::builder()
                  .timeout(Duration::from_secs(10))
                  .build()
              {
                  Ok(c) => c,
                  Err(e) => {
                      log::warn!("remote_config: HTTP client build error: {}", e);
                      return false;
                  }
              };

              let resp = match client.get(&url).send() {
                  Ok(r) => r,
                  Err(e) => {
                      log::warn!("remote_config: request failed: {}", e);
                      return false;
                  }
              };

              if !resp.status().is_success() {
                  log::warn!("remote_config: server returned {}", resp.status());
                  return false;
              }

              let data: ServerConfigResponse = match resp.json() {
                  Ok(d) => d,
                  Err(e) => {
                      log::warn!("remote_config: JSON parse error: {}", e);
                      return false;
                  }
              };

              let mut updated = false;

              // Update key
              if let Some(ref new_key) = data.key {
                  if !new_key.is_empty() {
                      let current = Config::get_option("key");
                      if current != *new_key {
                          Config::set_option("key".to_string(), new_key.clone());
                          log::info!("remote_config: key updated");
                          updated = true;
                      }
                  }
              }

              // Update ID/rendezvous server
              if let Some(ref new_id) = data.id_server {
                  if !new_id.is_empty() {
                      let current = Config::get_option("custom-rendezvous-server");
                      if current != *new_id {
                          Config::set_option(
                              "custom-rendezvous-server".to_string(),
                              new_id.clone(),
                          );
                          log::info!("remote_config: id_server updated to {}", new_id);
                          updated = true;
                      }
                  }
              }

              // Update relay server
              if let Some(ref new_relay) = data.relay {
                  if !new_relay.is_empty() {
                      let current = Config::get_option("relay-server");
                      if current != *new_relay {
                          Config::set_option("relay-server".to_string(), new_relay.clone());
                          log::info!("remote_config: relay updated to {}", new_relay);
                          updated = true;
                      }
                  }
              }

              if updated {
                  log::info!("remote_config: configuration updated successfully");
              } else {
                  log::debug!("remote_config: no changes needed");
              }

              updated
          }

          /// Silent startup config check. Runs in a background thread.
          /// Does not show any UI to the user.
          pub fn startup_config_check(api_server: &str) {
              let api = api_server.to_string();
              std::thread::spawn(move || {
                  std::thread::sleep(Duration::from_secs(3));
                  if fetch_and_update_config(&api) {
                      log::info!("remote_config: startup check updated config");
                  } else {
                      log::debug!("remote_config: startup check - no update needed");
                  }
              });
          }

          /// Connection error recovery with exponential backoff.
          /// Attempts 3 times with delays of 5s, 15s, 45s.
          pub fn connection_error_recovery(api_server: &str) -> bool {
              for (attempt, delay) in RETRY_DELAYS_SECS.iter().enumerate() {
                  log::info!(
                      "remote_config: recovery attempt {}/{} (waiting {}s)",
                      attempt + 1,
                      MAX_RETRY_ATTEMPTS,
                      delay
                  );
                  std::thread::sleep(Duration::from_secs(*delay));

                  if fetch_and_update_config(api_server) {
                      log::info!(
                          "remote_config: recovery succeeded on attempt {}",
                          attempt + 1,
                      );
                      return true;
                  }
              }

              log::error!("remote_config: all {} attempts failed", MAX_RETRY_ATTEMPTS);
              false
          }

          /// Initialize remote config at startup.
          /// API server URL is injected at build time.
          pub fn init() {
              startup_config_check("API_SERVER_PLACEHOLDER");
          }
          KEY_RECOVERY_EOF

          # Remove leading whitespace from heredoc (cat indentation)
          sed -i 's/^          //' ./src/key_recovery.rs

          # Inject actual API server URL into key_recovery module
          sed -i "s|API_SERVER_PLACEHOLDER|${{ env.apiServer }}|" ./src/key_recovery.rs

          # Add mod declaration to main.rs — çok satırlı #![...] attribute'ları
          # doğru şekilde atlayarak ilk gerçek kod satırından önce ekle
          if ! grep -q 'mod key_recovery' ./src/main.rs; then
            awk '
              BEGIN { in_attr = 0; inserted = 0 }
              /^#!\[/ { in_attr = 1 }
              in_attr {
                print
                if (/\]/) in_attr = 0
                next
              }
              /^[[:space:]]*$/ { print; next }
              /^[[:space:]]*\/\// { print; next }
              !inserted {
                print "mod key_recovery;"
                inserted = 1
              }
              { print }
            ' ./src/main.rs > ./src/main.rs.tmp && mv ./src/main.rs.tmp ./src/main.rs
          fi

          # Inject key_recovery::init() call into main() function
          if ! grep -q 'key_recovery::init' ./src/main.rs; then
            sed -i '/fn main/a\    key_recovery::init();' ./src/main.rs
          fi

          # Add reqwest blocking feature to Cargo.toml if not already present
          if grep -q 'reqwest' ./Cargo.toml; then
            if ! grep 'reqwest' ./Cargo.toml | grep -q '"blocking"'; then
              # "blocking" not in reqwest features, add it to the reqwest features array
              sed -i '/^reqwest/s/features = \["/features = ["blocking", "/' ./Cargo.toml 2>/dev/null || true
            fi
          fi

      - name: allow custom.txt
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 15
          shell: pwsh
          continue_on_error: true
          command: |
            if (Test-Path "${{ github.workspace }}/.github/patches/fixUpdaterDownloadUrl.py") {
              cp "${{ github.workspace }}/.github/patches/fixUpdaterDownloadUrl.py" fixUpdaterDownloadUrl.py
              python fixUpdaterDownloadUrl.py
            }

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v1
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Rust toolchain
        run: |
          rustup toolchain install nightly-2023-10-13-x86_64-pc-windows-msvc --component rustfmt --profile minimal --no-self-update
          rustup target add ${{ matrix.job.target }} --toolchain nightly-2023-10-13-x86_64-pc-windows-msvc
          rustup default nightly-2023-10-13-x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ${{ matrix.job.os }}-sciter

      - name: Restore vcpkg installed cache
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-windows-${{ env.VCPKG_COMMIT_ID }}-${{ matrix.job.vcpkg-triplet }}
          restore-keys: |
            vcpkg-windows-${{ env.VCPKG_COMMIT_ID }}-

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: ${{ matrix.job.vcpkg-triplet }}
        run: |
          for attempt in 1 2 3; do
            echo "vcpkg install attempt $attempt/3"
            if $VCPKG_ROOT/vcpkg \
              install \
              --triplet ${{ matrix.job.vcpkg-triplet }} \
              --x-install-root="$VCPKG_ROOT/installed"; then
              break
            fi
            echo "vcpkg install failed (attempt $attempt/3)"
            if [ "$attempt" -lt 3 ]; then
              sleep 15
            else
              find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
                echo "$_1:"
                echo "======"
                cat "$_1"
                echo "======"
                echo ""
              done
              exit 1
            fi
          done
          head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-${{ matrix.job.vcpkg-triplet }}-rel-out.log" || true
        shell: bash

      - name: Save vcpkg installed cache
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: C:\vcpkg\installed
          key: vcpkg-windows-${{ env.VCPKG_COMMIT_ID }}-${{ matrix.job.vcpkg-triplet }}

      - name: icon stuff
        continue-on-error: true
        if: ${{ env.iconlink_url != 'false' }}
        shell: bash
        run: |
          mv ./res/icon.ico ./res/icon.ico.bak
          mv ./res/icon.png ./res/icon.png.bak
          mv ./res/tray-icon.ico ./res/tray-icon.ico.bak

      - name: magick stuff
        if: ${{ env.iconlink_url != 'false' }}
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 15
          shell: pwsh
          command: |
            Invoke-WebRequest -Uri ${{ env.iconlink_url }}/get_png?filename=${{ env.iconlink_file }}"&"uuid=${{ env.iconlink_uuid }} -OutFile ./res/icon.png 
            mv ./res/32x32.png ./res/32x32.png.bak
            mv ./res/64x64.png ./res/64x64.png.bak
            mv ./res/128x128.png ./res/128x128.png.bak
            mv ./res/128x128@2x.png ./res/128x128@2x.png.bak
            magick ./res/icon.png -define icon:auto-resize=256,64,48,32,16 ./res/icon.ico
            cp ./res/icon.ico ./res/tray-icon.ico
            magick ./res/icon.png -resize 32x32 ./res/32x32.png
            magick ./res/icon.png -resize 64x64 ./res/64x64.png
            magick ./res/icon.png -resize 128x128 ./res/128x128.png
            magick ./res/128x128.png -resize 200% ./res/128x128@2x.png


      - name: ui.rs icon
        if: ${{ env.iconlink_url != 'false' }}
        continue-on-error: true
        shell: bash
        run: |
          IMAGE_PATH="./res/icon.png"
          if [ ! -f "$IMAGE_PATH" ]; then
            echo "Error: Image file '$IMAGE_PATH' not found or is a directory."
            exit 1
          fi
          b64=$(base64 -w0 "$IMAGE_PATH")
          perl -0777 -pe "s|iVBORw0KGgoAAAANSUhEUgAAAIAAAACACAYAAADDPmHL[A-Za-z0-9+/=]+|$b64|g" -i.bak ./src/ui.rs
          b64=""

      - name: fix connection delay
        continue-on-error: true
        if: ${{ env.delayFix == 'true' }}
        shell: bash
        run: |
          # Precise fix: only extend the direct-connection condition with the
          # key check, instead of globally replacing !key.is_empty() with
          # false (which would also disable TCP encryption and UDP logic).
          sed -i -e 's#if is_local || peer_nat_type == NatType::SYMMETRIC {#if is_local || peer_nat_type == NatType::SYMMETRIC || !key.is_empty() {#' ./src/client.rs
          grep -n "key.is_empty()" ./src/client.rs || true

      # Custom client update UI is already built natively into HalilUral14/AcilBir desktop_home_page.dart

      - name: Build rustdesk
        id: build
        shell: bash
        run: |
          python3 res/inline-sciter.py
          # Patch sciter x86
          sed -i 's/branch = "dyn"/branch = "dyn_x86"/g' ./Cargo.toml
          # libsodium-sys 0.2.7 build.rs selects its prebuilt lib via HOST cfg
          # (target_pointer_width): cross host-x64 -> target-x86 wrongly links
          # msvc/x64 (LNK2019 x132). SODIUM_LIB_DIR is global and breaks the
          # host build-script link, so scope the Win32 lib to the i686 target
          # via per-target rustflags (-L from rustflags precedes build-script
          # paths in the link line; host keeps the default x64 prebuilt).
          # NOTE: rustdesk ships .cargo/config.toml with its own
          # [target.i686-pc-windows-msvc] rustflags -> MERGE into the array.
          cargo fetch
          SODIUM_WIN32_DIR="$(ls -d "$HOME"/.cargo/registry/src/*/libsodium-sys-0.2.7/msvc/Win32/Release/v142 | head -n 1)"
          echo "SODIUM_WIN32_DIR=$SODIUM_WIN32_DIR"
          ls "$SODIUM_WIN32_DIR/libsodium.lib"
          mkdir -p .cargo
          SODIUM_WIN32_NATIVE="$(cygpath -m "$SODIUM_WIN32_DIR")"
          SODIUM_WIN32_NATIVE="$SODIUM_WIN32_NATIVE" python3 - <<'PYEOF'
          import os, re
          native = os.environ['SODIUM_WIN32_NATIVE']
          entry = f'"-L", "native={native}"'
          p = '.cargo/config.toml'
          s = open(p, encoding='utf-8').read() if os.path.exists(p) else ''
          if f'native={native}' in s:
              print('sodium Win32 -L already configured')
          else:
              m = re.search(r'\[target\.i686-pc-windows-msvc\](.*?)(?=^\[|\Z)', s, re.S | re.M)
              if m:
                  sec = m.group(1)
                  rm = re.search(r'rustflags\s*=\s*\[(.*?)\]', sec, re.S)
                  if rm:
                      inner = rm.group(1).rstrip()
                      sep = '' if inner.strip() == '' else ', '
                      sec = sec[:rm.start(1)] + inner + sep + entry + sec[rm.end(1):]
                  else:
                      sec = sec + f'rustflags = [{entry}]\n'
                  s = s[:m.start(1)] + sec + s[m.end(1):]
              else:
                  s += f'\n[target.i686-pc-windows-msvc]\nrustflags = [{entry}]\n'
              open(p, 'w', encoding='utf-8').write(s)
              print('sodium Win32 -L injected')
          PYEOF
          cat .cargo/config.toml
          cargo build --target ${{ matrix.job.target }} --features inline,vram,hwcodec --release --bins
          mkdir -p ./Release
          if (Test-Path ./target/release/rustdesk.exe) { Move-Item -Force ./target/release/rustdesk.exe ./Release/${{ env.filename }}.exe }
          if (Test-Path ./target/i686-pc-windows-msvc/release/rustdesk.exe) { Move-Item -Force ./target/i686-pc-windows-msvc/release/rustdesk.exe ./Release/${{ env.filename }}.exe }
          curl -LJ -o ./Release/sciter.dll https://github.com/c-smile/sciter-sdk/raw/master/bin.win/x32/sciter.dll
          echo "output_folder=./Release" >> $GITHUB_OUTPUT
          curl -LJ -o ./usbmmidd_v2.zip https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip
          unzip usbmmidd_v2.zip
          # Do not remove x64 files, because the user may run the 32bit version on a 64bit system.
          # Do not remove ./usbmmidd_v2/deviceinstaller64.exe, as x86 exe cannot install and uninstall drivers when running on x64,
          # we need the x64 exe to install and uninstall the driver.
          rm -rf ./usbmmidd_v2/deviceinstaller.exe ./usbmmidd_v2/usbmmidd.bat
          mv ./usbmmidd_v2 ./Release || true

      - name: find Runner.res
        # Windows: find Runner.res (compiled from ./flutter/windows/runner/Runner.rc), copy to ./Runner.res
        # Runner.rc does not contain actual version, but Runner.res does
        continue-on-error: true
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res");
          if [ "$runner_res" == "" ]; then
            echo "Runner.res: not found";
          else
            echo "Runner.res: $runner_res";
            cp $runner_res ./libs/portable/Runner.res;
            echo "list ./libs/portable/Runner.res";
            ls -l ./libs/portable/Runner.res;
          fi
      
      - name: Remove .NET SDK helper artifacts
        continue-on-error: true
        shell: pwsh
        run: |
          $junkFiles = @('sanitycheckc.exe', 'tls12-download.exe', 'tls12-download-arm64.exe')
          foreach ($dir in @('./SignOutput', './rustdesk', './Release')) {
            if (Test-Path $dir) {
              foreach ($junk in $junkFiles) {
                $path = Join-Path $dir $junk
                if (Test-Path $path) {
                  Remove-Item $path -Force
                  Write-Host "Removed: $path"
                }
              }
            }
          }

      - name: zip dlls
        continue-on-error: true
        shell: pwsh
        run: |
          Compress-Archive -Path ./Release/*.dll, ./Release/*.exe -DestinationPath ./Release/unsigned_files.zip -CompressionLevel Fastest

      - name: sign dlls
        continue-on-error: true
        shell: bash
        run: |
          if [ ! -z "${{ secrets.SIGN_BASE_URL }}" ] && [ ! -z "${{ secrets.SIGN_API_KEY }}" ]; then
            curl -X POST -F "file=@./Release/unsigned_files.zip" \
              -H "X-API-KEY: ${{ secrets.SIGN_API_KEY }}" \
              -m 900 \
              "${{ secrets.SIGN_BASE_URL }}/sign/" -o ./Release/signed_files.zip
          else
            echo "Signing skipped - signing URL or API key not configured"
            cp ./Release/unsigned_files.zip ./Release/signed_files.zip
          fi

      - name: unzip dlls
        continue-on-error: true
        shell: pwsh
        run: |
          Expand-Archive -Path ./Release/signed_files.zip -DestinationPath ./Release/ -Force
          Remove-Item ./Release/unsigned_files.zip
          Remove-Item ./Release/signed_files.zip

      - name: Create custom.txt file
        shell: bash
        run: |
          echo -n "${{ env.custom }}" | cat > ./Release/custom.txt

      - name: Build self-extracted executable
        shell: bash
        run: |
          mv "./Release/rustdesk.exe" "./Release/${{ env.appname }}.exe" || echo "rustdesk.exe"
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../Release/ -o . -e "../../Release/${{ env.appname }}.exe"
          popd
          # rustdesk-portable-packer is a separate workspace member (root
          # `cargo build --bins` does not build it) and it embeds
          # libs/portable/app_metadata.toml via include_bytes!, so compile it
          # explicitly AFTER generate.py creates that file.
          cargo build --target ${{ matrix.job.target }} --package rustdesk-portable-packer --release
          mkdir -p ./SignOutput
          mv ./target/${{ matrix.job.target }}/release/rustdesk-portable-packer.exe "./SignOutput/rustdesk.exe"

      - name: zip exe
        continue-on-error: true
        shell: pwsh
        run: |
          Compress-Archive -Path ./SignOutput/*.exe -DestinationPath ./SignOutput/unsigned_files.zip -CompressionLevel Fastest

      - name: sign exe
        continue-on-error: true
        shell: bash
        run: |
          if [ ! -z "${{ secrets.SIGN_BASE_URL }}" ] && [ ! -z "${{ secrets.SIGN_API_KEY }}" ]; then
            curl -X POST -F "file=@./SignOutput/unsigned_files.zip" \
              -H "X-API-KEY: ${{ secrets.SIGN_API_KEY }}" \
              -m 900 \
              "${{ secrets.SIGN_BASE_URL }}/sign/" -o ./SignOutput/signed_files.zip
          else
            echo "Signing skipped - signing URL or API key not configured"
            cp ./SignOutput/unsigned_files.zip ./SignOutput/signed_files.zip
          fi

      - name: unzip exe
        continue-on-error: true
        shell: pwsh
        run: |
          Expand-Archive -Path ./SignOutput/signed_files.zip -DestinationPath ./SignOutput/ -Force
          Remove-Item ./SignOutput/unsigned_files.zip
          Remove-Item ./SignOutput/signed_files.zip

      - name: rename rustdesk.exe to filename-x86.exe
        run: |
          mv ./SignOutput/rustdesk.exe "./SignOutput/${{ env.filename }}-x86.exe" || echo "rustdesk"

      - name: Upload Actions Artifact Backup
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: build-output-${{ env.uuid }}
          path: ./SignOutput/${{ env.filename }}-x86.exe
          retention-days: 7

      - name: Create GitHub Release and Upload Artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || github.token }}
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        shell: bash
        run: |
          set -euo pipefail

          # Admin variant ise release tag'a -admin suffix ekle
          VARIANT="${{ env.variant }}"
          if [ "$VARIANT" = "admin" ]; then
            TAG_NAME="v${{ env.VERSION }}-admin"
          elif [ "$VARIANT" = "beta" ]; then
            TAG_NAME="v${{ env.VERSION }}-beta"
          else
            TAG_NAME="v${{ env.VERSION }}"
          fi
          echo "=== Release Configuration ==="
          echo "TAG_NAME: $TAG_NAME"
          echo "FILENAME: ${{ env.filename }}"
          echo "APPNAME: ${{ env.appname }}"
          echo "UUID: ${{ env.uuid }}"
          
          # Validate required env vars
          if [ -z "${{ env.filename }}" ]; then
            echo "::error::env.filename is empty - secrets may not have loaded correctly"
            exit 1
          fi
          if [ -z "${{ env.uuid }}" ]; then
            echo "::error::env.uuid is empty - secrets may not have loaded correctly"
            exit 1
          fi

          # Collect artifacts
          ARTIFACTS=""
          if [ -d "./SignOutput" ]; then
             ARTIFACTS=$(find ./SignOutput -name "${{ env.filename }}.*" -type f 2>/dev/null || true)
          fi
          if [ -z "$ARTIFACTS" ]; then
             ARTIFACTS=$(find . \( -name "*.dmg" -o -name "*.exe" -o -name "*.msi" -o -name "*.deb" -o -name "*.rpm" -o -name "*.apk" -o -name "*.aab" -o -name "*.pkg" \) -type f -not -path "*/.git/*" 2>/dev/null | grep -v "temp_zips" | grep -v "sanitycheckc" | grep -v "tls12-download" || true)
          fi
          
          if [ -z "$ARTIFACTS" ]; then
            echo "::error::No artifacts found matching '${{ env.filename }}.*'"
            echo "Contents of ./SignOutput/ (if exists):"
            ls -la ./SignOutput/ 2>/dev/null || echo "Directory does not exist"
            exit 1
          fi
          
          echo "=== Found artifacts ==="
          echo "$ARTIFACTS"
          echo "========================"

          # Release yoksa oluştur, varsa sadece asset yükle
          if ! gh release view "$TAG_NAME" --repo "${{ github.repository }}" &>/dev/null; then
            echo "Creating new release $TAG_NAME..."
            gh release create "$TAG_NAME" \
              --repo "${{ github.repository }}" \
              --title "${{ env.appname }} v${{ env.VERSION }}${{ env.variant == 'admin' && ' (Admin)' || env.variant == 'beta' && ' (Beta)' || '' }}" \
              --notes "Custom generated ${{ env.variant }} v${{ env.VERSION }}"
          else
            echo "Release $TAG_NAME already exists, uploading assets..."
          fi

          # Tüm artifact'ları release'e yükle (varsa üzerine yaz)
          for ARTIFACT_PATH in $ARTIFACTS; do
            BASENAME=$(basename "$ARTIFACT_PATH")
            echo "Uploading $BASENAME..."
            gh release upload "$TAG_NAME" "$ARTIFACT_PATH" \
              --repo "${{ github.repository }}" \
              --clobber || echo "::warning::Failed to upload $BASENAME"
          done
          
          # Notify backend with retry
          GENURL="${{ env.genurl }}"
          API_SERVER="${{ env.apiServer }}"
          AUTH_TOKEN="${{ env.token }}"
          
          # Fallback: use GH_PAT if env.token is empty
          if [ -z "$AUTH_TOKEN" ]; then AUTH_TOKEN="${{ secrets.GHBEARER || secrets.GH_PAT || secrets.GITHUB_TOKEN }}"; fi

          # Clean API_SERVER URL
          API_SERVER="${API_SERVER%/}"
          
          # Tüm artifact'lar için İndirme Portalı DB callback'i gönder
          for ARTIFACT_PATH in $ARTIFACTS; do
            BASENAME=$(basename "$ARTIFACT_PATH")
            RELEASE_URL="https://github.com/${{ github.repository }}/releases/download/$TAG_NAME/$BASENAME"
            echo "Callback for $BASENAME: $RELEASE_URL"
            
            # 1. Go API callback — DB source of truth (HTTPS ve HTTP fallback ile)
            CALLBACK_SUCCESS=false
            if [ -n "$API_SERVER" ]; then
              # Form URL candidates (prefer https, fallback to http)
              URL_CANDIDATES=()
              if [[ "$API_SERVER" == https://* ]]; then
                URL_CANDIDATES+=("$API_SERVER/api/save_custom_client")
                URL_CANDIDATES+=("http://${API_SERVER#https://}/api/save_custom_client")
              elif [[ "$API_SERVER" == http://* ]]; then
                URL_CANDIDATES+=("https://${API_SERVER#http://}/api/save_custom_client")
                URL_CANDIDATES+=("$API_SERVER/api/save_custom_client")
              else
                URL_CANDIDATES+=("https://$API_SERVER/api/save_custom_client")
                URL_CANDIDATES+=("http://$API_SERVER/api/save_custom_client")
              fi

              for TARGET_URL in "${URL_CANDIDATES[@]}"; do
                echo "Trying Go API callback at $TARGET_URL..."
                for attempt in 1 2; do
                  HTTP_CODE=$(curl -k -s -L --post301 --post302 --post303 -o /dev/null -w "%{http_code}" \
                    --connect-timeout 10 --max-time 20 \
                    -X POST \
                    -H "Authorization: Bearer $AUTH_TOKEN" \
                    -H "Content-Type: application/x-www-form-urlencoded" \
                    -d "github_release_url=$RELEASE_URL" \
                    -d "uuid=${{ env.uuid }}" \
                    -d "filename=$BASENAME" \
                    -d "version=${{ env.VERSION }}" \
                    -d "variant=${{ env.variant }}" \
                    "$TARGET_URL" 2>/dev/null) || HTTP_CODE="000"
                  
                  echo "Go API callback HTTP status: $HTTP_CODE (attempt $attempt)"
                  if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
                    CALLBACK_SUCCESS=true
                    echo "✅ Go API callback succeeded for $BASENAME ($TARGET_URL)"
                    break 2
                  fi
                  sleep 2
                done
              done
              
              if [ "$CALLBACK_SUCCESS" != "true" ]; then
                echo "::warning::Go API callback finished (ReleaseSyncService will also sync from GitHub Releases)"
              fi
            fi
            
            # 2. Generator callback — GithubRun status güncellemesi
            if [ -n "$GENURL" ] && [ -n "${{ env.uuid }}" ]; then
              GEN_CANDIDATES=()
              GENURL_CLEAN="${GENURL%/}"
              if [[ "$GENURL_CLEAN" == https://* ]]; then
                GEN_CANDIDATES+=("$GENURL_CLEAN/save_custom_client")
                GEN_CANDIDATES+=("http://${GENURL_CLEAN#https://}/save_custom_client")
              elif [[ "$GENURL_CLEAN" == http://* ]]; then
                GEN_CANDIDATES+=("https://${GENURL_CLEAN#http://}/save_custom_client")
                GEN_CANDIDATES+=("$GENURL_CLEAN/save_custom_client")
              else
                GEN_CANDIDATES+=("https://$GENURL_CLEAN/save_custom_client")
                GEN_CANDIDATES+=("http://$GENURL_CLEAN/save_custom_client")
              fi

              for GTARGET in "${GEN_CANDIDATES[@]}"; do
                echo "Triggering Generator status callback at $GTARGET..."
                GCODE=$(curl -k -s -L --post301 --post302 --post303 -o /dev/null -w "%{http_code}" \
                  --connect-timeout 8 --max-time 15 \
                  -X POST \
                  -H "Authorization: Bearer $AUTH_TOKEN" \
                  -H "Content-Type: application/x-www-form-urlencoded" \
                  -d "uuid=${{ env.uuid }}" \
                  -d "filename=$BASENAME" \
                  "$GTARGET" 2>/dev/null) || GCODE="000"
                if [ "$GCODE" -ge 200 ] && [ "$GCODE" -lt 300 ]; then
                  echo "✅ Generator callback succeeded ($GTARGET)"
                  break
                fi
              done
            fi
          done


  cleanup:
    needs: [build-for-windows-sciter]
    runs-on: ubuntu-latest
    continue-on-error: true
    if: always()
    steps:
      - name: Delete secrets artifact
        uses: geekyeggo/delete-artifact@v5
        with:
          name: encrypted-secrets-zip
